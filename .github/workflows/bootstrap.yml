name: Bootstrap QuickDial source

on:
  workflow_dispatch:
  push:
    paths:
      - QuickDial-React-TypeScript.zip
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract source
        run: |
          unzip -o QuickDial-React-TypeScript.zip
          rm QuickDial-React-TypeScript.zip
          rm .github/workflows/deploy.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add QuickDial React application"
          git push
